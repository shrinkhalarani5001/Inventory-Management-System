<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Inventory'">Product</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <div>
        <h1 th:text="${pageTitle}">Add Product</h1>
        <p>Inventory Management System</p>
    </div>
    <a class="secondary-btn header-back" th:href="@{/}">← Back to Dashboard</a>
</header>

<main class="form-container">
    <section class="form-card">
        <h2 th:text="${pageTitle}">Add Product</h2>

        <form th:action="@{/products/save}" th:object="${product}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="form-grid">
                <label>
                    Product Name
                    <input type="text" th:field="*{name}" placeholder="e.g. Wireless Mouse">
                    <small class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                </label>

                <label>
                    SKU
                    <input type="text" th:field="*{sku}" placeholder="e.g. WM-001">
                    <small class="error" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></small>
                </label>

                <label>
                    Category
                    <input type="text" th:field="*{category}" placeholder="e.g. Electronics">
                    <small class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></small>
                </label>

                <label>
                    Price (₹)
                    <input type="number" step="0.01" min="0" th:field="*{price}" placeholder="999">
                    <small class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
                </label>

                <label>
                    Quantity
                    <input type="number" min="0" th:field="*{quantity}" placeholder="25">
                    <small class="error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></small>
                </label>

                <label>
                    Minimum Stock
                    <input type="number" min="0" th:field="*{minStock}" placeholder="5">
                    <small class="error" th:if="${#fields.hasErrors('minStock')}" th:errors="*{minStock}"></small>
                </label>
            </div>

            <label>
                Description
                <textarea rows="4" th:field="*{description}"
                          placeholder="Short product description"></textarea>
            </label>

            <div class="form-actions">
                <a class="secondary-btn" th:href="@{/}">Cancel</a>
                <button class="primary-btn" type="submit">Save Product</button>
            </div>
        </form>
    </section>
</main>

</body>
</html>
